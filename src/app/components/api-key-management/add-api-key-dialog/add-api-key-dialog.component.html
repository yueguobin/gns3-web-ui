<h2 mat-dialog-title>Create API Key</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Key name</mat-label>
    <input matInput [value]="name()" (input)="name.set($event.target.value)" (keyup.enter)="onSubmit()" placeholder="e.g. MCP Production" required />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!name().trim()" (click)="onSubmit()">Create</button>
</mat-dialog-actions>
