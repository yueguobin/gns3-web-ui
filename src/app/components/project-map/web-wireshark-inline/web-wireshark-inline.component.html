<!-- Main Window (hidden when minimized) -->
<div
  #windowWrapper
  class="web-wireshark-inline gns3-window"
  [class.gns3-window--dragging]="isDragging()"
  [class.gns3-window--resizing]="isResizing()"
  [class.is-minimized]="isMinimized()"
  [style.left.px]="chrome.left()"
  [style.top.px]="chrome.top()"
  [style.width.px]="chrome.width()"
  [style.height.px]="chrome.height()"
  [style.z-index]="zIndex()"
  (mousedown)="onWindowFocus()"
  mwlResizable
  [validateResize]="chrome.validate"
  [enableGhostResize]="false"
  (resizeStart)="chrome.onResizeStart()"
  (resizing)="chrome.onResizing($event)"
  (resizeEnd)="chrome.onResizeEnd($event)"
>
  <!-- Resize handles - hidden when minimized -->
  @if (!isMinimized()) {
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--top"
    mwlResizeHandle
    [resizeEdges]="{ top: true }"
  ></div>
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--right"
    mwlResizeHandle
    [resizeEdges]="{ right: true }"
  ></div>
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--bottom"
    mwlResizeHandle
    [resizeEdges]="{ bottom: true }"
  ></div>
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--left"
    mwlResizeHandle
    [resizeEdges]="{ left: true }"
  ></div>

  <!-- Corner handles (more discoverable) -->
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--top-left"
    mwlResizeHandle
    [resizeEdges]="{ top: true, left: true }"
  ></div>
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--top-right"
    mwlResizeHandle
    [resizeEdges]="{ top: true, right: true }"
  ></div>
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--bottom-left"
    mwlResizeHandle
    [resizeEdges]="{ bottom: true, left: true }"
  ></div>
  <div
    class="gns3-window__resize-handle gns3-window__resize-handle--bottom-right"
    mwlResizeHandle
    [resizeEdges]="{ bottom: true, right: true }"
  ></div>
  }

  <!-- Window content -->
  <div class="web-wireshark-inline__content">
    <!-- Header -->
    <div class="web-wireshark-inline-header gns3-window__header">
      <!-- Drag zone: the title strip IS the drag surface — the action
           toolbar on the right never starts a drag. -->
      <div class="web-wireshark-inline-header__title gns3-window__header-drag" (mousedown)="chrome.beginDrag($event)">
        <mat-icon class="header-icon">analytics</mat-icon>
        <span>Web Wireshark</span>
        <span class="link-info">{{ link().capture_file_name }}</span>
      </div>
      <div class="web-wireshark-inline-header__actions gns3-window__actions">
        <button
          mat-icon-button
          class="download-button"
          (click)="downloadPcapFile()"
          title="Download pcap file"
          [disabled]="isDownloading()"
        >
          <mat-icon [class.is-downloading]="isDownloading()">download</mat-icon>
        </button>
        <button
          mat-icon-button
          class="restart-button"
          (click)="restartWireshark()"
          title="Restart Web Wireshark"
          [disabled]="isRestarting()"
        >
          <mat-icon class="restart-icon" [class.is-spinning]="isRestarting()">restart_alt</mat-icon>
        </button>
        <button mat-icon-button class="minimize-button" (click)="toggleMinimize()" title="Minimize">
          <mat-icon>remove</mat-icon>
        </button>
        <button mat-icon-button class="close-button" (click)="close()" title="Close">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Iframe container -->
    <div class="web-wireshark-inline__iframe-container">
      @if (isLoading()) {
      <div class="loading-overlay">
        <mat-icon class="loading-icon">loading</mat-icon>
        <span>Starting Web Wireshark...</span>
      </div>
      }
      @if (isRestarting()) {
      <div class="restart-overlay">
        <img src="assets/gns3_icon.svg" class="restart-logo" alt="GNS3" />
        <span>Restarting Web Wireshark...</span>
      </div>
      }
      <iframe
        [src]="wiresharkUrl"
        class="web-wireshark-inline__iframe"
        allowfullscreen
        (load)="onIframeLoad()"
      ></iframe>
    </div>
  </div>
</div>
