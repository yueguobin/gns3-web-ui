<h1 mat-dialog-title>Save project as</h1>

<div mat-dialog-content>
  <mat-form-field class="form-field" subscriptSizing="dynamic">
    <input
      matInput
      placeholder="Project name"
      [value]="name()"
      (input)="name.set($event.target.value)"
      type="text"
      [disabled]="isSaving()"
    />
  </mat-form-field>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onCloseClick()" color="accent" [disabled]="isSaving()">Cancel</button>
  <button
    mat-button
    (click)="onSaveClick()"
    tabindex="2"
    mat-raised-button
    color="primary"
    [disabled]="isSaving()"
  >
    @if (isSaving()) {
    <mat-spinner class="saving-btn-spinner" diameter="18"></mat-spinner>
    <span>Saving...</span>
    } @else {
    <span>Save project</span>
    }
  </button>
</div>
