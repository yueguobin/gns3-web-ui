<div #terminal class="terminal"></div>

<!-- Terminal settings entry (same panel as the in-app console) -->
<button
  type="button"
  class="settings-toggle"
  [class.settings-toggle--active]="showSettingsPanel()"
  (click)="toggleSettingsPanel()"
  title="Terminal settings"
  aria-label="Terminal settings"
>
  <mat-icon>tune</mat-icon>
</button>

@if (showSettingsPanel()) {
<app-terminal-settings-panel
  [style.--gns3-terminal-settings-top]="'46px'"
  (closed)="closeSettingsPanel()"
/>
}
